name: Update TKTS Live boards

# Which shows are on the TKTS boards today (TDF's TKTS Live page).
# GitHub's scheduler often starts jobs hours late or skips them, so instead of hourly runs,
# each run stays up and re-checks the boards every 15 minutes for up to ~5.5 hours.
on:
  schedule:
    - cron: "5 14 * * *"    # ≈9 AM New York — covers the morning and early afternoon
    - cron: "5 19 * * *"    # ≈2 PM New York — covers the afternoon and evening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tkts-live
  cancel-in-progress: true

jobs:
  tkts:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Watch TKTS Live
        run: |
          git config user.name "theatermax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            node scripts/update-tkts.mjs || true
            if ! git diff --quiet -- data/tkts.js && git diff -- data/tkts.js | grep -E '^[+-] ' | grep -vq checkedAt; then
              git add data/tkts.js
              git commit -m "TKTS boards $(TZ=America/New_York date '+%b %-d %-I:%M %p')" || true
              for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break; sleep 10; done
            else
              git checkout -- data/tkts.js 2>/dev/null || true
            fi
            # After 9 PM New York the booths are closed; stop early.
            [ "$(TZ=America/New_York date +%H)" -ge 21 ] && break
            sleep 900
          done
