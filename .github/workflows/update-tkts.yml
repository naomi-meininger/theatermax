name: Update TKTS Live boards

# Booth hours: which shows are on the TKTS boards today (TDF TKTS Live page).
on:
  schedule:
    - cron: "17 15-23 * * *"   # ≈10:17 AM–6:17 PM New York (EST), hourly
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  tkts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch TKTS Live
        run: node scripts/update-tkts.mjs
      - name: Commit if boards changed
        run: |
          if git diff --quiet -- data/tkts.js; then echo "No changes."; exit 0; fi
          if [ "$(git diff -U0 -- data/tkts.js | grep '^[+-] ' | grep -v -E 'checkedAt' | wc -l)" = "0" ]; then
            echo "Only timestamps changed — skipping commit."; exit 0
          fi
          git config user.name "theatermax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tkts.js
          git commit -m "Update TKTS Live boards ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main
          git push
