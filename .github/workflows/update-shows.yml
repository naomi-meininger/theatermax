name: Update show list

on:
  schedule:
    - cron: "17 10 * * *"   # every day at 10:17 UTC (≈5 AM New York)
  workflow_dispatch:         # lets you run it from the Actions tab

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape current Broadway & Off-Broadway shows
        run: node scripts/update-shows.mjs

      - name: Commit if the list changed
        run: |
          if git diff --quiet -- data/live-shows.js; then
            echo "No changes."
            exit 0
          fi
          # Ignore changes that are only timestamps
          if [ "$(git diff -U0 -- data/live-shows.js | grep '^[+-] ' | grep -v -E 'updatedAt|lastAttemptAt' | wc -l)" = "0" ]; then
            echo "Only the timestamp changed — skipping commit."
            exit 0
          fi
          git config user.name "theatermax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-shows.js
          git commit -m "Update Broadway show list ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main
          git push
