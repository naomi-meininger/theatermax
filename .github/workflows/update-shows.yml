name: Update show list

on:
  schedule:
    - cron: "17 10 * * *"   # every day at 10:17 UTC (≈5 AM New York)
  workflow_dispatch:         # lets you run it from the Actions tab

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape current Broadway & Off-Broadway shows
        run: node scripts/update-shows.mjs

      - name: Fetch each show's real performance calendar (dates & curtain times)
        run: node scripts/update-schedules.mjs

      - name: Commit if anything changed
        run: |
          FILES="data/live-shows.js data/schedules.js"
          if git diff --quiet -- $FILES && [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No changes."
            exit 0
          fi
          # Ignore changes that are only timestamps
          if [ -z "$(git status --porcelain --untracked-files=all -- $FILES | grep '^??')" ] && [ "$(git diff -U0 -- $FILES | grep '^[+-] ' | grep -v -E 'updatedAt|lastAttemptAt' | wc -l)" = "0" ]; then
            echo "Only timestamps changed — skipping commit."
            exit 0
          fi
          git config user.name "theatermax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Update Broadway show list & calendars ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push && break; sleep $((i*10)); done
