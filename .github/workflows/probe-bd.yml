name: Probe Broadway Direct fees
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://tickets.broadwaydirect.com/api/v1/agentic
          E=$(curl -sS "$B/events?seriesCode=843567&pageSize=5" | jq -r '.result[2].id')
          curl -sS "$B/events/$E/inventory" -o i.json
          echo "=== TOP KEYS"; jq -c 'keys' i.json
          echo "=== NON-SEAT"; jq -c 'del(.seats)' i.json | head -c 4000; echo
          echo "=== SEATS 0-2"; jq -c '.seats[0:3]' i.json
          echo "=== DISTINCT SEAT KEYS"; jq -c '[.seats[]|keys]|unique' i.json
          echo "=== BEST"; curl -sS "$B/events/$E/best-available?quantity=2" | head -c 2500; echo
          echo "=== EVENT"; curl -sS "$B/events/$E" | head -c 2500; echo
          echo "=== OPENAPI fee"; curl -sS "$B/openapi.yaml" | grep -n -i -B2 -A4 'fee' | head -60
