name: Probe Broadway Direct agent API
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://tickets.broadwaydirect.com/api/v1/agentic
          curl -sS "$B/events/series" -o s.json
          echo "=== SERIES"; jq -c '.result[]|{name,seriesCode,venue:.venue.name,eventCount,low:.metadata.lowPrice,high:.metadata.highPrice,slug:.metadata.slug}' s.json
          C=$(jq -r '.result[0].seriesCode' s.json)
          curl -sS "$B/events?seriesCode=$C&pageSize=3" -o e.json
          echo "=== EVENTS"; jq -c . e.json | head -c 3000; echo
          E=$(jq -r '.result[0].eventId // .result[0].id' e.json)
          echo "=== INVENTORY $E"; curl -sS "$B/events/$E/inventory" -o i.json; jq 'del(.. | .seats? // empty)' i.json | head -c 6000; echo
          echo "=== INVENTORY keys"; jq -c 'paths(scalars) | map(tostring) | join(".")' i.json | sed 's/\.[0-9]\+\./.N./g' | sort -u | head -80
          echo "=== BEST 2"; curl -sS "$B/events/$E/best-available?quantity=2" | head -c 3000; echo
