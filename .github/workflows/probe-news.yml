name: Probe news feeds
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="TheaterMax/1.0 (+https://naomi-meininger.github.io/theatermax/)"
          echo "=== PLAYBILL FEEDS PAGE"; curl -sSL -A "$UA" https://playbill.com/article/playbill-rss-feeds | grep -oiE 'href="[^"]*(rss|feed)[^"]*"' | sort -u | head -20
          for u in https://playbill.com/rss/news https://www.playbill.com/rss/news https://broadwaydirect.com/feed/ https://www.broadway.com/feeds/buzz/latest/ https://www.broadwayworld.com/rss/news.xml; do
            echo "=== $u"; curl -sSL -A "$UA" -o f.xml -w "%{http_code} %{content_type}\n" "$u"; grep -oE '<title>[^<]{0,140}|<title><!\[CDATA\[[^]]{0,140}' f.xml | head -8; grep -c '<item' f.xml; done
