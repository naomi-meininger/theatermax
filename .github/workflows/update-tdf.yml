name: Update TDF listings

# Every Tuesday, refresh TDF member-ticket and TKTS facts for our shows from tdf.org.
on:
  schedule:
    - cron: "37 10 * * 2"   # Tuesdays ≈5:37 AM New York
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tdf
  cancel-in-progress: false

jobs:
  tdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch TDF show pages
        run: node scripts/update-tdf.mjs
      - name: Commit if TDF data changed
        run: |
          if git diff --quiet -- data/tdf.js; then echo "No changes."; exit 0; fi
          if [ "$(git diff -U0 -- data/tdf.js | grep '^[+-] ' | grep -v -E 'updatedAt|lastAttemptAt' | wc -l)" = "0" ]; then
            echo "Only timestamps changed — skipping commit."; exit 0
          fi
          git config user.name "theatermax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tdf.js
          git commit -m "Update TDF listings ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push && break; sleep $((i*10)); done
