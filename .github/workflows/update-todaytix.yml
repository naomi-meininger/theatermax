name: Update TodayTix prices

# Daily: TodayTix prices for the next 13 days from TodayTix's official MCP server.
on:
  schedule:
    - cron: "23 11 * * *"   # daily ≈6:23 AM New York
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: todaytix
  cancel-in-progress: false

jobs:
  todaytix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch TodayTix prices
        run: node scripts/update-todaytix.mjs
      - name: Commit if prices changed
        run: |
          if git diff --quiet -- data/todaytix.js; then echo "No changes."; exit 0; fi
          if [ "$(git diff -U0 -- data/todaytix.js | grep '^[+-] ' | grep -v -E 'updatedAt|lastAttemptAt' | wc -l)" = "0" ]; then
            echo "Only timestamps changed — skipping commit."; exit 0
          fi
          git config user.name "theatermax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/todaytix.js
          git commit -m "Update TodayTix prices ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push && break; sleep $((i*10)); done
