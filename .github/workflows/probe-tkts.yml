name: Probe TKTS Live (one-off)

# Discovery run against TodayTix's official MCP server. Saves tools + sample responses
# to data/tkts-probe.json so the price updater can use the real field names.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe-tkts.mjs
      - name: Commit probe output
        run: |
          git config user.name "theatermax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tkts-probe.json
          git commit -m "TKTS probe output" || exit 0
          git pull --rebase --autostash origin main
          git push
